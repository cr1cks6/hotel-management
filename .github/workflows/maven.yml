name: Java CI with Maven

on:
  push:
    branches: [ "main", "lab_6" ]
  pull_request:
    branches: [ "main", "lab_6" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # --- ЭТОТ БЛОК СОЗДАЕТ БАЗУ ДАННЫХ В GITHUB ---
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hotel_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # Ждем, пока база загрузится, прежде чем запускать тесты
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Расшифровываем ваш сертификат (как требовалось в задании)
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > src/main/resources/hotel-server.jks

      # --- ЗАПУСК ТЕСТОВ ---
      - name: Build with Maven
        run: mvn -B package --file pom.xml
        env:
          # Тут мы говорим Spring Boot подключиться к базе, которую создали выше
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hotel_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: password
          # Разрешаем Hibernate создать таблицы для теста
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          # Пароль от вашего сертификата
          SERVER_SSL_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-app-jar
          path: target/*.jar