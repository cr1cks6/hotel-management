name: Java CI with Maven

on:
  push:
    branches: [ "main", "lab_6" ]
  pull_request:
    branches: [ "main", "lab_6" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Настройки базы данных для тестов
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hotel_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Эти переменные будут доступны во ВСЕХ шагах ниже
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hotel_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SERVER_SSL_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > src/main/resources/hotel-server.jks

      # --- ВОТ ВАШ ОТДЕЛЬНЫЙ ШАГ С ТЕСТАМИ ---
      # Он появится в списке как "Run Tests"
      - name: Run Tests
        run: mvn -B test --file pom.xml

      # --- СБОРКА JAR (без повторного запуска тестов, чтобы не тратить время) ---
      - name: Build JAR
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-app-jar
          path: target/*.jar